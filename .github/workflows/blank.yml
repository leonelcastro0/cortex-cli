# This is a basic workflow to help you get started with Actions
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
    # README commits DO NOT trigger the pipeline
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
  # Allows running this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Adding env. variables globally to retrieve Secrets from GitHub, and set image name
    env:
      CORTEX_URL: https://api-xsiamnfrsentria.xdr.us.paloaltonetworks.com
      API_ID: ${{ secrets.CORTEX_API_KEY_ID }}
      API_KEY: ${{ secrets.CORTEX_API_KEY }}
      IMAGE_NAME: "mi-app:ci-${{ github.sha }}"   # <-- tag propio, evita ambigüedad con ubuntu:18.04 de Docker Hub

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks out the repository under $GITHUB_WORKSPACE, so the job can access it
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .   # Build the image, tagging it con IMAGE_NAME

      - name: Download Cortex dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libhyperscan5 jq

      - name: Download cortexcli
        run: |
          set -euxo pipefail

          crtx_resp=$(curl -sS "${CORTEX_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${API_ID}" \
            -H "Authorization: ${API_KEY}")

          echo "Respuesta API: $crtx_resp"

          # Si la API devolvió un error explícito, cortar acá
          if echo "$crtx_resp" | jq -e '.error_code' > /dev/null 2>&1; then
            echo "Failed to retrieve CLI download link. Response: $crtx_resp"
            exit 1
          fi

          crtx_url=$(echo "$crtx_resp" | jq -r ".signed_url")

          if [ -z "$crtx_url" ] || [ "$crtx_url" == "null" ]; then
            echo "No se pudo obtener signed_url. Respuesta completa arriba."
            exit 1
          fi

          curl -sS -o cortexcli "$crtx_url"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Run Cortex CLI Code Scan
        run: |
          set -euxo pipefail
          ./cortexcli \
            --api-base-url "${CORTEX_URL}" \
            --api-key "${API_KEY}" \
            --api-key-id "${API_ID}" \
            image scan \
            "$IMAGE_NAME"
