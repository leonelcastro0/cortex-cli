name: CI
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-lates
    env:
      CORTEX_URL: https://api-xsiamnfrsentria.xdr.us.paloaltonetworks.com
      API_ID: ${{ secrets.API_ID }}
      API_KEY: ${{ secrets.API_KEY }}
      IMAGE_NAME: "mi-app:ci-${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t "$IMAGE_NAME" .

      - name: Download Cortex dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y libhyperscan5 jq

      - name: Download cortexcli
        run: |
          set -euxo pipefail

          crtx_resp=$(curl -sS "${CORTEX_URL}/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64" \
            -H "x-xdr-auth-id: ${API_ID}" \
            -H "Authorization: ${API_KEY}")

          echo "Respuesta API: $crtx_resp"

          # Si la API devolvió un error explícito, cortar acá
          if echo "$crtx_resp" | jq -e '.error_code' > /dev/null 2>&1; then
            echo "Failed to retrieve CLI download link. Response: $crtx_resp"
            exit 1
          fi

          crtx_url=$(echo "$crtx_resp" | jq -r ".signed_url")

          if [ -z "$crtx_url" ] || [ "$crtx_url" == "null" ]; then
            echo "No se pudo obtener signed_url. Respuesta completa arriba."
            exit 1
          fi

          curl -sS -o cortexcli "$crtx_url"
          chmod +x cortexcli
          ./cortexcli --version

      - name: Run Cortex CLI Code Scan
        run: |
          set -euxo pipefail
          ./cortexcli \
            --api-base-url "${CORTEX_URL}" \
            --api-key "${API_KEY}" \
            --api-key-id "${API_ID}" \
            image scan \
            "$IMAGE_NAME"
